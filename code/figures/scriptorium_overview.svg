<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1180" viewBox="0 0 2200 1180" role="img" aria-labelledby="title desc">
  <title id="title">Scriptorium: file-native memory with a store / retrieve / reorganize loop</title>
  <desc id="desc">Dialogue is archived append-only into Source memory. The LLM writer places copied text into a Markdown wiki via retrieval-simulated placement. At query time the agent navigates the same wiki with ls, cat, grep, BM25, timeline, and read_original, then answers from selected evidence. Retrieval traces feed a reorganization step that renames, moves, splits, merges, and links wiki nodes.</desc>
  <defs>
    <style>
      .bg    { fill:#ffffff; }
      .stage { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; }
      .card  { fill:#ffffff; stroke-width:2.5; }
      .agent { stroke:#7048e8; fill:#f7f4ff; }
      .state { stroke:#2f9e44; fill:#f1fbf3; }
      .src   { stroke:#e8590c; fill:#fff5eb; }
      .tool  { stroke:#8695ab; fill:#f4f6f9; }
      .stagetitle { font:700 30px Arial,Helvetica,sans-serif; fill:#0f172a; }
      .stagenum   { font:700 26px Arial,Helvetica,sans-serif; fill:#94a3b8; }
      .label { font:700 25px Arial,Helvetica,sans-serif; fill:#1e293b; }
      .body  { font:400 21px Arial,Helvetica,sans-serif; fill:#475569; }
      .mono  { font:400 20px "SF Mono",Menlo,Consolas,monospace; fill:#334155; }
      .tiny  { font:400 18px Arial,Helvetica,sans-serif; fill:#64748b; }
      .c { text-anchor:middle; }
      .purple{fill:#5f3dc4} .green{fill:#237a36} .orange{fill:#c2410c}
      .fl-o { fill:none; stroke:#e8590c; stroke-width:3.5; }
      .fl-p { fill:none; stroke:#7048e8; stroke-width:3.5; }
      .fl-g { fill:none; stroke:#8695ab; stroke-width:3; }
      .fl-fb{ fill:none; stroke:#7048e8; stroke-width:3.5; stroke-dasharray:11 8; }
    </style>
    <marker id="ao" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11z" fill="#e8590c"/></marker>
    <marker id="ap" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11z" fill="#7048e8"/></marker>
    <marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 11 6 1 11z" fill="#8695ab"/></marker>
  </defs>

  <rect class="bg" width="2200" height="1180"/>

  <!-- ============ STAGE 1 : STORE ============ -->
  <rect class="stage" x="50" y="70" width="620" height="760" rx="22"/>
  <text class="stagenum" x="86" y="122">1</text>
  <text class="stagetitle" x="118" y="122">Store</text>
  <text class="tiny" x="118" y="152">new dialogue → wiki</text>

  <rect class="card src" x="90" y="190" width="540" height="118" rx="14"/>
  <text class="label orange" x="120" y="234">Dialogue stream</text>
  <text class="body" x="120" y="270">multi-session turns, arriving in order</text>

  <path class="fl-o" d="M 360 308 V 372" marker-end="url(#ao)"/>

  <rect class="card src" x="90" y="380" width="540" height="150" rx="14"/>
  <text class="label orange" x="120" y="424">Source Memory</text>
  <text class="body" x="120" y="459">append-only raw turns, stable IDs</text>
  <text class="tiny" x="120" y="492">never overwritten · cited by every memory</text>

  <rect class="card agent" x="90" y="600" width="540" height="190" rx="14"/>
  <text class="label purple" x="120" y="646">Writer agent</text>
  <text class="body" x="120" y="684">RSP: “where would I look for this later?”</text>
  <text class="body" x="120" y="718">write it exactly there</text>
  <text class="tiny" x="120" y="756">copy, don’t generate — verbatim text + source ref</text>

  <path class="fl-o" d="M 250 530 V 596" marker-end="url(#ao)"/>
  <text class="tiny orange" x="266" y="570">archive</text>

  <!-- ============ STAGE 2 : THE MEMORY WORKSPACE ============ -->
  <rect class="stage" x="740" y="70" width="640" height="760" rx="22"/>
  <text class="stagenum" x="776" y="122">2</text>
  <text class="stagetitle" x="808" y="122">Memory workspace</text>
  <text class="tiny" x="808" y="152">one folder of plain text — nothing else stores a fact</text>

  <!-- authoritative -->
  <text class="tiny green" x="790" y="196">AUTHORITATIVE · agent-written, never regenerated</text>

  <rect class="card state" x="790" y="210" width="540" height="286" rx="14"/>
  <text class="label green" x="818" y="252">topics/  — the wiki</text>
  <text class="tiny" x="818" y="280">folder → file → heading → paragraph, all concretely named</text>
  <rect class="card state" x="822" y="300" width="476" height="176" rx="10"/>
  <text class="mono" x="846" y="336">腾讯/张三.md</text>
  <text class="mono" x="846" y="372">  ## 工作经历</text>
  <text class="mono" x="846" y="408">    [2024-03-15] 和上海会议…</text>
  <text class="tiny" x="846" y="446">one paragraph = one memory + its source ref</text>

  <rect class="card src" x="790" y="512" width="262" height="126" rx="12"/>
  <text class="label orange" x="814" y="552">sources/</text>
  <text class="tiny" x="814" y="580">raw turns, append-only</text>
  <text class="tiny" x="814" y="606">read-only (0444)</text>

  <rect class="card state" x="1068" y="512" width="262" height="126" rx="12"/>
  <text class="label green" x="1092" y="552">core.md</text>
  <text class="tiny" x="1092" y="580">goals, constraints</text>
  <text class="tiny" x="1092" y="606">token-capped, cited</text>

  <!-- derived -->
  <text class="tiny" x="790" y="676">DERIVED · rebuilt from the above on every commit</text>

  <rect class="card tool" x="790" y="690" width="172" height="112" rx="12"/>
  <text class="mono" x="812" y="726">timeline/</text>
  <text class="tiny" x="812" y="754">year/month/day</text>
  <text class="tiny" x="812" y="780">dated entries</text>

  <rect class="card tool" x="974" y="690" width="172" height="112" rx="12"/>
  <text class="mono" x="996" y="726">recent</text>
  <text class="tiny" x="996" y="754">last 50 blocks</text>
  <text class="tiny" x="996" y="780">FIFO, preloaded</text>

  <rect class="card tool" x="1158" y="690" width="172" height="112" rx="12"/>
  <text class="mono" x="1180" y="726">relations</text>
  <text class="tiny" x="1180" y="754">links, backlinks</text>
  <text class="tiny" x="1180" y="780">from Markdown</text>

  <path class="fl-g" d="M 1060 644 V 686" marker-end="url(#ag)"/>
  <text class="tiny" x="1076" y="672">rebuild</text>

  <path class="fl-p" d="M 630 690 H 700 V 360 H 786" marker-end="url(#ap)"/>
  <text class="tiny purple" x="646" y="672">place</text>

  <!-- ============ STAGE 3 : RETRIEVE ============ -->
  <rect class="stage" x="1450" y="70" width="700" height="760" rx="22"/>
  <text class="stagenum" x="1486" y="122">3</text>
  <text class="stagetitle" x="1518" y="122">Retrieve</text>
  <text class="tiny" x="1518" y="152">question → navigate wiki → grounded answer</text>

  <rect class="card agent" x="1490" y="190" width="620" height="118" rx="14"/>
  <text class="label purple" x="1520" y="234">Navigator agent</text>
  <text class="body" x="1520" y="270">picks the next tool from the current gap — no fixed pipeline</text>

  <path class="fl-p" d="M 1800 308 V 366" marker-end="url(#ap)"/>

  <rect class="card tool" x="1490" y="374" width="620" height="266" rx="14"/>
  <text class="mono" x="1524" y="422">ls / cat</text>
  <text class="tiny" x="1524" y="448">walk the self-built directory</text>
  <text class="mono" x="1524" y="500">grep</text>
  <text class="tiny" x="1524" y="526">exact names, phrases, IDs</text>
  <text class="mono" x="1524" y="578">timeline</text>
  <text class="tiny" x="1524" y="604">order, duration, state change</text>
  <text class="mono" x="1820" y="422">bm25_search</text>
  <text class="tiny" x="1820" y="448">lexical candidates</text>
  <text class="mono" x="1820" y="500">embedding_search</text>
  <text class="tiny" x="1820" y="526">semantic candidates (optional)</text>
  <text class="mono" x="1820" y="578">read_original</text>
  <text class="tiny" x="1820" y="604">verify against Source</text>
  <line x1="1795" y1="400" x2="1795" y2="616" stroke="#dbe1ea" stroke-width="2"/>

  <path class="fl-p" d="M 1800 640 V 700" marker-end="url(#ap)"/>

  <rect class="card agent" x="1490" y="708" width="620" height="106" rx="14"/>
  <text class="label purple" x="1520" y="752">Evidence-grounded answer</text>
  <text class="tiny" x="1520" y="786">answers only from retrieved text; every claim carries a source ref</text>

  <!-- wiki <-> retrieval -->
  <path class="fl-g" d="M 1334 570 H 1400 V 500 H 1486" marker-end="url(#ag)"/>
  <text class="tiny c" x="1408" y="482">navigate</text>
  <path class="fl-g" d="M 1334 250 H 1440 V 250 H 1486" marker-end="url(#ag)"/>
  <text class="tiny c" x="1410" y="228">core + recent</text>
  <text class="tiny c" x="1410" y="272">preloaded</text>

  <!-- Source verification path: read_original reaches back to Source -->
  <path class="fl-o" d="M 2110 604 H 2168 V 1088 H 40 V 455 H 86" marker-end="url(#ao)"/>
  <text class="tiny orange" x="1440" y="1080">read_original — verify any claim against the raw turn</text>

  <!-- ============ FEEDBACK LOOP : RFR ============ -->
  <rect class="card agent" x="740" y="880" width="640" height="176" rx="14"/>
  <text class="label purple" x="770" y="924">Reorganizer agent (RFR)</text>
  <text class="body" x="770" y="960">retrieval traces show where the model chose wrong</text>
  <text class="tiny" x="770" y="996">naming → rename · placement → move · granularity → split/merge</text>
  <text class="tiny" x="770" y="1026">association → cross-link  ·  same four fixes at every level</text>

  <path class="fl-fb" d="M 1770 818 V 968 H 1386" marker-end="url(#ap)"/>
  <text class="tiny purple" x="1440" y="948">traces</text>
  <path class="fl-fb" d="M 1060 876 V 802" marker-end="url(#ap)"/>
  <text class="tiny purple" x="1076" y="852">restructure</text>

  <text class="tiny" x="60" y="1145">orange = raw source and verification · purple = LLM decisions · green = authoritative Markdown state · gray = tools. Everything the agent reads is a text file; indexes are rebuildable.</text>
</svg>
